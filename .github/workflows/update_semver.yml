name: Gateway Release
run-name: Gateway release ${{ github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-release-master
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/ci-common.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish GitHub Release
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: write
    outputs:
      decision: ${{ steps.publish.outputs.decision }}
      release_type: ${{ steps.publish.outputs.release_type }}
      previous_version: ${{ steps.publish.outputs.previous_version }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_version: ${{ steps.publish.outputs.release_version }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
    steps:
      - name: Check out verified master revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - id: publish
        name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          decision_file="$RUNNER_TEMP/gateway-release-decision.json"
          rm -f "$decision_file"
          export GATEWAY_RELEASE_DECISION_FILE="$decision_file"
          git tag --points-at HEAD --list 'v*' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+\$" | sort > tags-before.txt || test $? -eq 1
          npx --no-install semantic-release
          git fetch --tags origin
          git tag --points-at HEAD --list 'v*' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+\$" | sort > tags-after.txt || test $? -eq 1

          created_tag="$(comm -13 tags-before.txt tags-after.txt)"
          recovery_tag=''
          if [[ -z "$created_tag" ]]; then
            candidate_tag="$(sed -n '1p' tags-before.txt)"
            if [[ -n "$candidate_tag" ]] && gh release view "$candidate_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true; then
              recovery_tag="$candidate_tag"
            fi
          fi
          test -f "$decision_file"
          decision="$(node tools/ci/release-decision.mjs "$decision_file" "$recovery_tag" "$(git rev-parse HEAD)")"
          release_tag="$(jq -r '.gitTag // empty' <<< "$decision")"
          if [[ -n "$created_tag" ]] && [[ "$release_tag" != "$created_tag" ]]; then
            echo 'semantic-release created a tag without a matching lifecycle decision record.' >&2
            exit 1
          fi
          if [[ "$release_tag" == *$'\n'* || ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ -n "$release_tag" ]]; then
              echo "Invalid stable release tag: $release_tag" >&2
              exit 1
            fi
            {
              echo "decision=$(jq -r '.decision' <<< "$decision")"
              echo "release_type=$(jq -r '.releaseType // empty' <<< "$decision")"
              echo "previous_version=$(jq -r '.previousVersion // empty' <<< "$decision")"
            } >> "$GITHUB_OUTPUT"
            printf '## Gateway release decision: %s\n\n%s\n' "$(jq -r '.decision' <<< "$decision")" "$(jq -r '.reason' <<< "$decision")" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          test "$release_sha" = "$(git rev-parse HEAD)"
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          {
            echo "decision=$(jq -r '.decision' <<< "$decision")"
            echo "release_type=$(jq -r '.releaseType // empty' <<< "$decision")"
            echo "previous_version=$(jq -r '.previousVersion // empty' <<< "$decision")"
            echo "release_tag=$release_tag"
            echo "release_version=${release_tag#v}"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Gateway release decision: $(jq -r '.decision' <<< "$decision")

          $(jq -r '.reason' <<< "$decision")

          - Previous version: \`$(jq -r '.previousVersion // "none"' <<< "$decision")\`
          - Tag: \`$release_tag\`
          - Source SHA: \`$release_sha\`
          EOF

  deliver:
    name: Deliver Gateway v${{ needs.publish.outputs.release_version }}
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.release_tag != '' }}
    needs: publish
    permissions:
      contents: write
      deployments: read
    uses: ./.github/workflows/release-tag.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag }}
      release_sha: ${{ needs.publish.outputs.release_sha }}
      redeploy: false
      release_decision: ${{ needs.publish.outputs.decision }}
      release_type: ${{ needs.publish.outputs.release_type }}
      previous_version: ${{ needs.publish.outputs.previous_version }}
    secrets: inherit

  delivery-result:
    name: Report Gateway delivery result
    if: ${{ always() }}
    needs: [verify, publish, deliver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release reporting scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evaluate final delivery result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          DELIVERY_RESULT: ${{ needs.deliver.result }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(jq -cn --arg verifyResult "$VERIFY_RESULT" --arg publishResult "$PUBLISH_RESULT" --arg gitTag "$RELEASE_TAG" --arg deliveryResult "$DELIVERY_RESULT" '{verifyResult: $verifyResult, publishResult: $publishResult, gitTag: $gitTag, deliveryResult: $deliveryResult}')"
          result="$(DELIVERY_EVIDENCE="$evidence" node tools/ci/delivery-result.mjs)"
          printf '## Gateway final delivery: %s\n\n%s\n' "$(jq -r '.finalOutcome' <<< "$result")" "$(jq -r '.reason' <<< "$result")" >> "$GITHUB_STEP_SUMMARY"
          case "$(jq -r '.finalOutcome' <<< "$result")" in
            NO_RELEASE|PUBLISHED) ;;
            *) exit 1 ;;
          esac
