name: Gateway Build & Release
run-name: Gateway Build & Release — master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-release-master
  cancel-in-progress: false

jobs:
  verify:
    name: Verify master quality
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/ci-common.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Create semantic tag and draft release
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: write
    outputs:
      decision: ${{ steps.publish.outputs.decision }}
      release_type: ${{ steps.publish.outputs.release_type }}
      previous_version: ${{ steps.publish.outputs.previous_version }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_version: ${{ steps.publish.outputs.release_version }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
      release_id: ${{ steps.publish.outputs.release_id }}
    steps:
      - name: Check out verified master revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - id: publish
        name: Create immutable tag and GitHub Release
        env:
          # This PAT is intentionally used instead of GITHUB_TOKEN: GitHub suppresses
          # workflow runs caused by events authenticated with GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'GH_PAT is required to create the tag that starts Gateway Deployment.' >&2; exit 1; }
          decision_file="$RUNNER_TEMP/gateway-release-decision.json"
          rm -f "$decision_file"
          export GATEWAY_RELEASE_DECISION_FILE="$decision_file"
          git tag --points-at HEAD --list 'v*' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+\$" | sort > tags-before.txt || test $? -eq 1
          npx --no-install semantic-release
          git fetch --tags origin
          git tag --points-at HEAD --list 'v*' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+\$" | sort > tags-after.txt || test $? -eq 1

          created_tag="$(comm -13 tags-before.txt tags-after.txt)"
          recovery_file=''
          if [[ -z "$created_tag" ]]; then
            candidate_tag="$(sed -n '1p' tags-before.txt)"
            if [[ -n "$candidate_tag" ]]; then
              release_pages="$RUNNER_TEMP/gateway-releases.json"
              recovery_file="$RUNNER_TEMP/gateway-release-recovery.json"
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'flatten' > "$release_pages"
              node tools/ci/release-resolver.mjs "$release_pages" "$candidate_tag" "$(git rev-parse HEAD)" > "$recovery_file"
            fi
          fi
          test -f "$decision_file"
          if [[ -n "$recovery_file" ]]; then
            decision="$(node tools/ci/release-decision.mjs "$decision_file" "$recovery_file")"
          else
            decision="$(node tools/ci/release-decision.mjs "$decision_file")"
          fi
          release_tag="$(jq -r '.gitTag // empty' <<< "$decision")"
          if [[ -n "$created_tag" ]] && [[ "$release_tag" != "$created_tag" ]]; then
            echo 'semantic-release created a tag without a matching lifecycle decision record.' >&2
            exit 1
          fi
          if [[ "$release_tag" == *$'\n'* || ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ -n "$release_tag" ]]; then
              echo "Invalid stable release tag: $release_tag" >&2
              exit 1
            fi
            {
              echo "decision=$(jq -r '.decision' <<< "$decision")"
              echo "release_type=$(jq -r '.releaseType // empty' <<< "$decision")"
              echo "previous_version=$(jq -r '.previousVersion // empty' <<< "$decision")"
            } >> "$GITHUB_OUTPUT"
            printf '## Gateway release decision: %s\n\n%s\n' "$(jq -r '.decision' <<< "$decision")" "$(jq -r '.reason' <<< "$decision")" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          test "$release_sha" = "$(git rev-parse HEAD)"
          release_id="$(jq -r '.releaseId // empty' <<< "$decision")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Release creation completed without a numeric REST release ID.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.body' > release-notes.md
          sed '/<!-- gateway-release-source:start -->/,/<!-- gateway-release-source:end -->/d' release-notes.md > updated-release-notes.md
          cat >> updated-release-notes.md <<EOF

          <!-- gateway-release-source:start -->
          ## Gateway release source

          - Commit: \`$release_sha\`
          - Master quality check: \`Verify master quality / Confirm common Gateway quality checks\`
          <!-- gateway-release-source:end -->
          EOF
          jq -n --rawfile body updated-release-notes.md '{body: $body}' > release-update.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input release-update.json > /dev/null
          {
            echo "decision=$(jq -r '.decision' <<< "$decision")"
            echo "release_type=$(jq -r '.releaseType // empty' <<< "$decision")"
            echo "previous_version=$(jq -r '.previousVersion // empty' <<< "$decision")"
            echo "release_tag=$release_tag"
            echo "release_version=${release_tag#v}"
            echo "release_sha=$release_sha"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Gateway release decision: $(jq -r '.decision' <<< "$decision")

          $(jq -r '.reason' <<< "$decision")

          - Previous version: \`$(jq -r '.previousVersion // "none"' <<< "$decision")\`
          - Tag: \`$release_tag\`
          - Source SHA: \`$release_sha\`
          EOF
