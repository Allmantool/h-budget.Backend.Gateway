name: Gateway Deployment
run-name: Gateway Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag to recover.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-production
  cancel-in-progress: false

env:
  GATEWAY_IMAGE_REPOSITORY: allmantool/homebudget-backend-gateway
  MASTER_QUALITY_CHECK: Verify master quality / Confirm common Gateway quality checks

jobs:
  verify-release:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate tag, master quality, and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --tags origin
          git fetch origin master --depth=1
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/master
          gh api "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?per_page=100" > check-runs.json
          jq -e --arg name "$MASTER_QUALITY_CHECK" '[.check_runs[] | select(.name == $name and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")] | length > 0' check-runs.json > /dev/null || {
            echo "No successful trusted master-quality check named '$MASTER_QUALITY_CHECK' exists for $release_sha." >&2; exit 1; }
          release_id=''
          release_code='RELEASE_NOT_FOUND_YET'
          release_detail='No release lookup was attempted.'
          api_failure=''
          for _ in $(seq 1 12); do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.ndjson 2> api-error.txt; then
              api_failure="$(<api-error.txt)"
              if grep -Eq 'HTTP 401|HTTP 403|Resource not accessible' api-error.txt; then release_code='RELEASE_API_ACCESS_DENIED'; else release_code='RELEASE_API_ERROR'; fi
              release_detail="$api_failure"
              break
            fi
            jq -s 'flatten' releases.ndjson > releases.json
            discovery="$(node tools/ci/release-resolver.mjs releases.json "$RELEASE_TAG" "$release_sha")"
            release_code="$(jq -r '.code' <<< "$discovery")"
            release_detail="$(jq -r '.detail // empty' <<< "$discovery")"
            if [[ "$release_code" == RELEASE_READY ]]; then
              candidate_id="$(jq -er '.releaseId' <<< "$discovery")"
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/$candidate_id" > release.json 2> api-error.txt; then
                api_failure="$(<api-error.txt)"
                if grep -Eq 'HTTP 401|HTTP 403|Resource not accessible' api-error.txt; then release_code='RELEASE_API_ACCESS_DENIED'; else release_code='RELEASE_API_ERROR'; fi
                release_detail="$api_failure"
                break
              fi
              if node tools/ci/release-resolver.mjs --verify release.json "$candidate_id" "$RELEASE_TAG" "$release_sha" > /dev/null 2> resolver-error.txt; then
                release_id="$candidate_id"
                break
              fi
              release_code='RELEASE_METADATA_INVALID'
              release_detail="$(<resolver-error.txt)"
              break
            fi
            [[ "$release_code" == RELEASE_NOT_FOUND_YET || "$release_code" == RELEASE_METADATA_PENDING ]] || break
            sleep 5
          done
          if [[ -z "$release_id" && "$release_code" != RELEASE_API_ACCESS_DENIED && "$release_code" != RELEASE_API_ERROR ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update_semver.yml/runs?head_sha=$release_sha&per_page=1" > producer-runs.json 2> api-error.txt; then
              producer_status="$(jq -r '.workflow_runs[0].status // empty' producer-runs.json)"
              producer_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' producer-runs.json)"
              if [[ "$producer_status" == completed && "$producer_conclusion" != success ]]; then
                release_code='RELEASE_PRODUCER_FAILED'
                release_detail="Gateway Build & Release completed with conclusion $producer_conclusion."
              fi
            else
              api_failure="$(<api-error.txt)"
              if grep -Eq 'HTTP 401|HTTP 403|Resource not accessible' api-error.txt; then release_code='RELEASE_API_ACCESS_DENIED'; else release_code='RELEASE_API_ERROR'; fi
              release_detail="$api_failure"
            fi
          fi
          [[ -n "$release_id" ]] || { echo "::error title=$release_code::$release_detail"; echo "$release_code: $release_detail" >&2; exit 1; }
          { echo "release_tag=$RELEASE_TAG"; echo "release_version=${RELEASE_TAG#v}"; echo "release_sha=$release_sha"; echo "release_id=$release_id"; } >> "$GITHUB_OUTPUT"

  build-image:
    name: Build Gateway image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./dockerfile
          target: final
          build-args: |
            BUILD_VERSION=${{ needs.verify-release.outputs.release_version }}
            BUILD_SHA=${{ needs.verify-release.outputs.release_sha }}
          tags: ${{ env.GATEWAY_IMAGE_REPOSITORY }}:${{ needs.verify-release.outputs.release_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.release_version }}
          outputs: type=docker,dest=/tmp/gateway-image.tar
          cache-from: type=gha,scope=gateway-release
          cache-to: type=gha,mode=max,scope=gateway-release
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gateway-image-${{ needs.verify-release.outputs.release_tag }}
          path: /tmp/gateway-image.tar
          retention-days: 1
          if-no-files-found: error
      - name: Smoke-test exact candidate
        run: |
          chmod +x tools/ci/container-smoke.sh
          docker load --input /tmp/gateway-image.tar
          tools/ci/container-smoke.sh --image "${{ env.GATEWAY_IMAGE_REPOSITORY }}:${{ needs.verify-release.outputs.release_version }}" --mode success
          tools/ci/container-smoke.sh --image "${{ env.GATEWAY_IMAGE_REPOSITORY }}:${{ needs.verify-release.outputs.release_version }}" --mode invalid-config

  push-image:
    name: Publish Gateway ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }} to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-release, build-image]
    environment:
      name: production
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gateway-image-${{ needs.verify-release.outputs.release_tag }}
          path: docker-artifacts
      - run: docker load --input docker-artifacts/gateway-image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: publish
        name: Validate and publish immutable image tags
        env:
          IMAGE_NAME: ${{ env.GATEWAY_IMAGE_REPOSITORY }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          version_ref="$IMAGE_NAME:$RELEASE_VERSION"; sha_ref="$IMAGE_NAME:sha-$RELEASE_SHA"
          inspect_tag() { local ref="$1" output; if output="$(docker manifest inspect "$ref" 2>&1)"; then docker pull "$ref" >/dev/null; [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")" == "$RELEASE_SHA" && "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ref")" == "$RELEASE_VERSION" ]] || { echo "Conflicting immutable image: $ref" >&2; exit 1; }; echo true; elif [[ "$output" == *'no such manifest'* || "$output" == *'manifest unknown'* ]]; then echo false; else echo "$output" >&2; exit 1; fi; }
          version_exists="$(inspect_tag "$version_ref")"; sha_exists="$(inspect_tag "$sha_ref")"
          if [[ "$version_exists" == false && "$sha_exists" == false ]]; then docker tag "$version_ref" "$sha_ref"; docker push "$version_ref"; docker push "$sha_ref"; elif [[ "$version_exists" == true && "$sha_exists" == false ]]; then docker pull "$version_ref" >/dev/null; docker tag "$version_ref" "$sha_ref"; docker push "$sha_ref"; elif [[ "$version_exists" == false && "$sha_exists" == true ]]; then docker pull "$sha_ref" >/dev/null; docker tag "$sha_ref" "$version_ref"; docker push "$version_ref"; fi
          docker pull "$version_ref" >/dev/null; docker pull "$sha_ref" >/dev/null
          digest="$(docker image inspect "$version_ref" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"; sha_digest="$(docker image inspect "$sha_ref" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          test -n "$digest" && test "$digest" = "$sha_digest"; echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  finalize-release:
    name: Finalize GitHub Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-release, build-image, push-image]
    if: ${{ needs.verify-release.result == 'success' && needs.build-image.result == 'success' && needs.push-image.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Attach publication evidence and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          IMAGE_REF: ${{ env.GATEWAY_IMAGE_REPOSITORY }}:${{ needs.verify-release.outputs.release_version }}
          IMAGE_DIGEST: ${{ needs.push-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body' > release-notes.md
          sed '/<!-- gateway-release-trace:start -->/,/<!-- gateway-release-trace:end -->/d' release-notes.md > updated-notes.md
          cat >> updated-notes.md <<EOF

          <!-- gateway-release-trace:start -->
          ## Gateway publication traceability
          - Commit: \`$RELEASE_SHA\`
          - Publication: Docker Hub registry publication
          - Environment: [production registry publication]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/deployments/activity_log?environment=production)
          - Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Image: \`$IMAGE_REF@$IMAGE_DIGEST\`
          <!-- gateway-release-trace:end -->
          EOF
          jq -n --rawfile body updated-notes.md '{body: $body, draft: false}' > release-update.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input release-update.json > /dev/null

  delivery-result:
    name: Report Gateway ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }} publication
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-release, build-image, push-image, finalize-release]
    permissions:
      contents: read
      deployments: read
    steps:
      - id: upstream
        name: Require successful publication prerequisites
        env:
          VERIFY_RESULT: ${{ needs.verify-release.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          PUBLISH_RESULT: ${{ needs.push-image.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_RESULT" == success && "$BUILD_RESULT" == success && "$PUBLISH_RESULT" == success && "$FINALIZE_RESULT" == success ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo '## Gateway publication report pending'
            echo '- Release qualification: '"$VERIFY_RESULT"
            echo '- Image build: '"$BUILD_RESULT"
            echo '- Image publication: '"$PUBLISH_RESULT"
            echo '- Release finalization: '"$FINALIZE_RESULT"
            echo '- Final release, registry, and Environment evidence was not read back.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '[GW-REPORT-UPSTREAM] Required publication prerequisite did not succeed.' >&2
          exit 1
      - name: Check out reporting automation
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node.js for reporting helpers
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify reporting workspace
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/ci/report-workspace.mjs
          reporting_sha="$(git rev-parse HEAD)"
          [[ "$reporting_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "Reporting workspace: $PWD"
            echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
            echo "Reporting automation SHA: $reporting_sha"
            echo "Released application SHA: ${{ needs.verify-release.outputs.release_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read back release, registry, and environment evidence
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.verify-release.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          PUBLISH_RESULT: ${{ needs.push-image.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          IMAGE_REPOSITORY: ${{ env.GATEWAY_IMAGE_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.push-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"; printf "%s" "$release" > release.json
          node tools/ci/release-resolver.mjs --verify-final release.json "$RELEASE_ID" "$RELEASE_TAG" > /dev/null
          docker pull "$IMAGE_REPOSITORY:$RELEASE_VERSION" >/dev/null; docker pull "$IMAGE_REPOSITORY:sha-$RELEASE_SHA" >/dev/null
          digest="$(docker image inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" --format "{{index .RepoDigests 0}}" | cut -d@ -f2)"; sha_digest="$(docker image inspect "$IMAGE_REPOSITORY:sha-$RELEASE_SHA" --format "{{index .RepoDigests 0}}" | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && test "$digest" = "$IMAGE_DIGEST" && test "$digest" = "$sha_digest"
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&sha=$RELEASE_SHA&per_page=100" > deployments.json
          deployment_id="$(node tools/ci/deployment-evidence.mjs deployment-id deployments.json production)"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" > deployment-statuses.json
          node tools/ci/deployment-evidence.mjs require-success deployment-statuses.json
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Gateway $RELEASE_TAG published to Docker Hub

          - Release: $release_url
          - Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$RELEASE_SHA
          - Image: \`$IMAGE_REPOSITORY@$digest\`
          EOF
