name: Gateway PR Verification

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  common-quality:
    name: Run common Gateway quality checks
    uses: ./.github/workflows/ci-common.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release-policy:
    name: Validate PR release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install release-policy dependencies
        run: npm ci --ignore-scripts
      - name: Validate branch and PR title
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/ci/release-policy.mjs --branch "$PR_BRANCH" --title "$PR_TITLE"
      - name: Test release and gate policy fixtures
        run: npm run test:release-policy
      - name: Record candidate evidence
        run: |
          {
            echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "Tested merge-candidate SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  gateway-pr-gate:
    name: Gateway PR Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [common-quality, release-policy]
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evaluate every required validation result
        env:
          GATE_RESULTS: ${{ toJson(needs) }}
        run: node tools/ci/pr-gate.mjs
